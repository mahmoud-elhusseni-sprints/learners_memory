[project]
name = "learner-memory"
version = "0.1.0"
description = "learn-os — learner memory cards and profile management"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "qdrant-client>=1.11",
  "supabase>=2.7",
  "litellm>=1.55",
  "langgraph>=0.2,<1.0",   # agentic extraction graphs (coderbyte assessment)
  "langfuse>=2.53,<3",   # v2 keeps litellm's classic "langfuse" callback; v3+ moves to OTEL
  "structlog>=24.4",
  "prometheus-fastapi-instrumentator>=7.0",
  "python-jose[cryptography]>=3.3",
  "httpx>=0.27",
  "jinja2>=3.1",
  "tenacity>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "testcontainers>=4.8",
       "ruff>=0.6", "mypy>=1.11", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learner_memory"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
