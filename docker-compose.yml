name: learner-memory

x-app: &app
  build:
    context: .
    dockerfile: deploy/Dockerfile
  env_file: [.env]
  environment:
    # Only the in-stack services are pinned here. QDRANT_URL, SUPABASE_URL and
    # the LLM proxy stay whatever .env says — they are remote/managed.
    DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/learner_memory
    REDIS_URL: redis://redis:6379/0
  volumes:
    - ./src:/app/src
    - ./docs:/app/docs
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_started}

services:
  # ---------------- application ----------------
  api:
    <<: *app
    command: uvicorn learner_memory.main:app --host 0.0.0.0 --port 8000 --reload
    ports: ["8000:8000"]

  worker-extract:
    <<: *app
    command: celery -A learner_memory.workers.celery_app worker -Q ingest,extract -c 4 -l info

  worker-profile:
    <<: *app
    command: celery -A learner_memory.workers.celery_app worker -Q profile -c 2 -l info

  worker-maintenance:
    <<: *app
    command: celery -A learner_memory.workers.celery_app worker -Q maintenance -c 1 -l info

  beat:
    <<: *app
    command: celery -A learner_memory.workers.celery_app beat -l info   # exactly one replica

  # ---------------- data stores ----------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: learner_memory
    ports: ["55432:5432"] 
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  # Celery broker + result backend. Not optional: the workers and beat need it.
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]   # 6379 is taken by the langfuse stack
    volumes: ["redisdata:/data"]

  # ---------------- observability ----------------
  prometheus:
    image: prom/prometheus:v2.55.0
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports: ["9092:9090"]   # 9090 is taken by langfuse-minio

  celery-exporter:
    image: danihodovic/celery-exporter:0.11.0
    command: --broker-url=redis://redis:6379/0
    ports: ["9808:9808"]
    depends_on: [redis]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports: ["3002:3000"]   # 3000 is taken by the shared langfuse stack
    depends_on: [prometheus]

volumes:
  pgdata: {}
  redisdata: {}
  promdata: {}
  grafanadata: {}
