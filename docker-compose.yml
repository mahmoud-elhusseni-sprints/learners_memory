name: learner-memory

x-app: &app
  build:
    context: .
    dockerfile: deploy/Dockerfile
  env_file: [.env]
  environment:
    DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/learner_memory
    REDIS_URL: redis://redis:6379/0
    QDRANT_URL: http://qdrant:6333
    SUPABASE_URL: http://storage:5000
  volumes:
    - ./src:/app/src
    - ./docs:/app/docs
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_started}
    qdrant: {condition: service_started}

services:
  # ---------------- application ----------------
  api:
    <<: *app
    command: uvicorn learner_memory.main:app --host 0.0.0.0 --port 8000 --reload
    ports: ["8000:8000"]

  worker-extract:
    <<: *app
    command: celery -A learner_memory.workers.celery_app worker -Q ingest,extract -c 4 -l info

  worker-profile:
    <<: *app
    command: celery -A learner_memory.workers.celery_app worker -Q profile -c 2 -l info

  worker-maintenance:
    <<: *app
    command: celery -A learner_memory.workers.celery_app worker -Q maintenance -c 1 -l info

  beat:
    <<: *app
    command: celery -A learner_memory.workers.celery_app beat -l info   # exactly one replica

  # ---------------- data stores ----------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: learner_memory
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]

  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrantdata:/qdrant/storage"]

  # ---------------- supabase storage (single bucket) ----------------
  storage:
    image: supabase/storage-api:v1.11.13
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      ANON_KEY: ${SUPABASE_ANON_KEY:-anon-local-key}
      SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-service-local-key}
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-chars}
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
      FILE_SIZE_LIMIT: "524288000"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: local
      REGION: local
      GLOBAL_S3_BUCKET: learner-evidence
    ports: ["5000:5000"]
    volumes: ["storagedata:/var/lib/storage"]

  studio:
    image: supabase/studio:20241028-a265374
    environment:
      SUPABASE_URL: http://storage:5000
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: postgres
    ports: ["3001:3000"]
    depends_on: [storage]

  meta:
    image: supabase/postgres-meta:v0.84.2
    environment:
      PG_META_PORT: "8080"
      PG_META_DB_HOST: postgres
      PG_META_DB_PORT: "5432"
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: postgres
    depends_on:
      postgres: {condition: service_healthy}

  # ---------------- observability ----------------
  prometheus:
    image: prom/prometheus:v2.55.0
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports: ["9090:9090"]

  celery-exporter:
    image: danihodovic/celery-exporter:0.11.0
    command: --broker-url=redis://redis:6379/0
    ports: ["9808:9808"]
    depends_on: [redis]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  pgdata: {}
  redisdata: {}
  qdrantdata: {}
  storagedata: {}
  promdata: {}
  grafanadata: {}
